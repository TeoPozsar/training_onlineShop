
services:
  postgres:
    image: postgres:17
    container_name: online-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: online_shop
      POSTGRES_USER: teo_pozsar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
